<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Arial Black', 'Impact', sans-serif;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bg {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0a00 50%, #0a0a0a 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* fire glow circles */
  .glow1 {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,80,0,0.35) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .glow2 {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,200,0,0.2) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .tag {
    font-size: 28px;
    letter-spacing: 8px;
    color: #ff6600;
    text-transform: uppercase;
    margin-bottom: 20px;
    font-family: 'Arial', sans-serif;
    font-weight: 900;
  }
  .emoji-fire {
    font-size: 110px;
    line-height: 1;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 30px rgba(255,100,0,0.9));
  }
  .title {
    font-size: 130px;
    font-weight: 900;
    line-height: 0.9;
    text-align: center;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #ffaa00 50%, #ff4400 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -4px;
    filter: drop-shadow(0 0 20px rgba(255,100,0,0.5));
    margin-bottom: 10px;
  }
  .subtitle {
    font-size: 38px;
    color: #ffffff;
    font-family: 'Arial', sans-serif;
    font-weight: 400;
    letter-spacing: 2px;
    margin-bottom: 50px;
    opacity: 0.85;
  }
  .cta-box {
    background: linear-gradient(135deg, #ff4500, #ff8c00);
    border-radius: 60px;
    padding: 22px 70px;
    margin-bottom: 40px;
    box-shadow: 0 0 40px rgba(255,100,0,0.6), 0 0 80px rgba(255,100,0,0.3);
  }
  .cta {
    font-size: 40px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .url {
    font-size: 30px;
    color: #ff9944;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    opacity: 0.9;
  }
  .corner-logo {
    position: absolute;
    bottom: 50px;
    right: 60px;
    font-size: 24px;
    color: rgba(255,255,255,0.4);
    font-family: 'Arial', sans-serif;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .sparks {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }
  .spark {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ffaa00;
    box-shadow: 0 0 6px #ffaa00;
  }
</style>
</head>
<body>
<div class="bg">
  <div class="glow1"></div>
  <div class="glow2"></div>

  <!-- random sparks -->
  <div class="sparks">
    <div class="spark" style="top:12%;left:18%;width:6px;height:6px;background:#ff6600;"></div>
    <div class="spark" style="top:22%;left:82%;"></div>
    <div class="spark" style="top:75%;left:10%;width:3px;height:3px;"></div>
    <div class="spark" style="top:65%;left:88%;width:7px;height:7px;background:#ff4400;"></div>
    <div class="spark" style="top:8%;left:55%;width:5px;height:5px;"></div>
    <div class="spark" style="top:88%;left:65%;width:4px;height:4px;background:#ff8800;"></div>
    <div class="spark" style="top:35%;left:5%;width:5px;height:5px;background:#ffcc00;"></div>
    <div class="spark" style="top:45%;left:93%;width:3px;height:3px;background:#ffcc00;"></div>
  </div>

  <div class="tag">CodeStarters Presents</div>
  <div class="emoji-fire">🔥</div>
  <div class="title">FIRE<br>HACKS</div>
  <div class="subtitle">the hackathon that actually goes hard</div>
  <div class="cta-box">
    <div class="cta">Register Now →</div>
  </div>
  <div class="url">codestarters.xyz/firehacks</div>

  <div class="corner-logo">@codestarters_cupertino</div>
</div>
</body>
</html>
