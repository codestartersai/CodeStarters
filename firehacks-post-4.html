<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Arial Black', sans-serif;
    background: #0a0a0a;
  }
  .bg {
    width: 1080px;
    height: 1080px;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px;
    position: relative;
  }
  .watermark {
    position: absolute;
    top: 50px;
    right: 60px;
    font-size: 22px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 4px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .claim {
    font-size: 42px;
    color: #ff4500;
    text-transform: uppercase;
    letter-spacing: 5px;
    margin-bottom: 30px;
    font-weight: 900;
  }
  .main-text {
    font-size: 88px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    line-height: 0.95;
    text-transform: uppercase;
    margin-bottom: 30px;
    letter-spacing: -2px;
  }
  .main-text .fire { color: #ff4500; }
  .cross-out {
    text-decoration: line-through;
    color: #555;
    font-size: 60px;
    display: block;
    margin-bottom: 8px;
  }
  .divider {
    width: 200px;
    height: 4px;
    background: linear-gradient(90deg, #ff4500, #ff8c00);
    border-radius: 2px;
    margin: 20px 0 30px;
  }
  .rows {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
    max-width: 800px;
    margin-bottom: 40px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 20px;
    background: #181818;
    border-radius: 16px;
    padding: 22px 30px;
    border-left: 5px solid #ff4500;
  }
  .row-emoji { font-size: 36px; }
  .row-text {
    font-size: 26px;
    color: #fff;
    font-weight: 700;
    font-family: 'Arial', sans-serif;
  }
  .row-text .dim { color: #666; }
  .cta-pill {
    background: linear-gradient(135deg, #ff4500, #ff8c00);
    border-radius: 60px;
    padding: 20px 60px;
    box-shadow: 0 0 50px rgba(255,100,0,0.5);
  }
  .cta-pill-text {
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="bg">
  <div class="watermark">@codestarters_cupertino</div>

  <div class="claim">skill issue?</div>
  <div class="main-text">
    <span class="cross-out">no experience</span>
    <span class="fire">no problem.</span>
  </div>
  <div class="divider"></div>

  <div class="rows">
    <div class="row">
      <span class="row-emoji">🧠</span>
      <span class="row-text"><span class="dim">never coded before?</span> welcome aboard</span>
    </div>
    <div class="row">
      <span class="row-emoji">👥</span>
      <span class="row-text"><span class="dim">no team?</span> find one at fire hacks</span>
    </div>
    <div class="row">
      <span class="row-emoji">💡</span>
      <span class="row-text"><span class="dim">no idea?</span> we've got workshops for that</span>
    </div>
    <div class="row">
      <span class="row-emoji">🏆</span>
      <span class="row-text"><span class="dim">no portfolio?</span> fire hacks fixes that</span>
    </div>
  </div>

  <div class="cta-pill">
    <div class="cta-pill-text">codestarters.xyz/firehacks 🔥</div>
  </div>
</div>
</body>
</html>
