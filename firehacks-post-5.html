<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Arial Black', sans-serif;
    background: #0a0a0a;
  }
  .bg {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(160deg, #0f0f0f 0%, #1a0500 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 700px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,70,0,0.25) 0%, transparent 70%);
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
  }
  .header {
    font-size: 36px;
    font-weight: 900;
    color: #ff6600;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .big-title {
    font-size: 110px;
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: -3px;
    line-height: 0.9;
    text-align: center;
    margin-bottom: 16px;
  }
  .big-title span { color: #ff4500; }
  .sub {
    font-size: 32px;
    color: #888;
    font-family: 'Arial', sans-serif;
    margin-bottom: 55px;
    letter-spacing: 2px;
  }

  .prizes-grid {
    display: flex;
    gap: 24px;
    margin-bottom: 50px;
  }
  .prize-card {
    background: #1c1c1c;
    border-radius: 20px;
    padding: 30px 28px;
    text-align: center;
    width: 200px;
    border: 2px solid #2a2a2a;
    position: relative;
  }
  .prize-card.gold {
    border-color: #ffcc00;
    box-shadow: 0 0 30px rgba(255,200,0,0.2);
  }
  .prize-card.silver {
    border-color: #aaa;
    box-shadow: 0 0 20px rgba(170,170,170,0.15);
  }
  .prize-card.bronze {
    border-color: #cd7f32;
    box-shadow: 0 0 20px rgba(205,127,50,0.15);
  }
  .prize-emoji { font-size: 52px; display: block; margin-bottom: 8px; }
  .prize-place {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-family: 'Arial', sans-serif;
  }
  .prize-card.gold   .prize-place { color: #ffcc00; }
  .prize-card.silver .prize-place { color: #cccccc; }
  .prize-card.bronze .prize-place { color: #cd7f32; }
  .prize-amount {
    font-size: 30px;
    font-weight: 900;
    color: #fff;
  }

  .perks-row {
    display: flex;
    gap: 30px;
    margin-bottom: 50px;
  }
  .perk {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    color: #ccc;
    font-family: 'Arial', sans-serif;
    font-weight: 700;
  }
  .perk-emoji { font-size: 28px; }

  .bottom-cta {
    background: linear-gradient(135deg, #ff4500, #ff8c00);
    border-radius: 60px;
    padding: 20px 70px;
    box-shadow: 0 0 50px rgba(255,100,0,0.5);
  }
  .bottom-cta-text {
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
  }
  .corner-tag {
    position: absolute;
    bottom: 50px;
    left: 60px;
    font-size: 22px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 3px;
    font-weight: 700;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="bg">
  <div class="glow"></div>
  <div class="corner-tag">@codestarters_cupertino</div>

  <div class="header">🔥 fire hacks 🔥</div>
  <div class="big-title">WIN<br><span>big.</span></div>
  <div class="sub">build something. win something.</div>

  <div class="prizes-grid">
    <div class="prize-card gold">
      <span class="prize-emoji">🥇</span>
      <div class="prize-place">1st Place</div>
      <div class="prize-amount">Prizes<br>+ Clout</div>
    </div>
    <div class="prize-card silver">
      <span class="prize-emoji">🥈</span>
      <div class="prize-place">2nd Place</div>
      <div class="prize-amount">Prizes<br>+ Glory</div>
    </div>
    <div class="prize-card bronze">
      <span class="prize-emoji">🥉</span>
      <div class="prize-place">3rd Place</div>
      <div class="prize-amount">Prizes<br>+ Stories</div>
    </div>
  </div>

  <div class="perks-row">
    <div class="perk"><span class="perk-emoji">🍕</span> free food</div>
    <div class="perk"><span class="perk-emoji">🎁</span> swag</div>
    <div class="perk"><span class="perk-emoji">🤝</span> networking</div>
    <div class="perk"><span class="perk-emoji">💻</span> workshops</div>
  </div>

  <div class="bottom-cta">
    <div class="bottom-cta-text">codestarters.xyz/firehacks →</div>
  </div>
</div>
</body>
</html>
